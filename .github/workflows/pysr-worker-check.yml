name: PySR worker check

on:
  push:
    branches:
      - fix-windows-python-executable
    paths:
      - .github/workflows/pysr-worker-check.yml
      - scripts/pysr_worker_probe.py
  workflow_dispatch:

jobs:
  worker-check:
    name: ${{ matrix.variant.mode }} (Python ${{ matrix.python }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.14"
        variant:
          - mode: legacy0934
            pyjuliacall: "0.9.34"
          - mode: pre1362
            pyjuliacall: "0.9.35"
          - mode: post1362
            pyjuliacall: "0.9.35"
          - mode: upstream-fixed
            pyjuliacall: "0.9.35"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: pysr-test
          python-version: ${{ matrix.python }}

      - name: Install released packages
        shell: pwsh
        run: conda install --yes --channel conda-forge "python=${{ matrix.python }}" "pysr=2.3.1" "pyjuliacall=${{ matrix.variant.pyjuliacall }}"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.0"

      - name: Install fixed juliacall
        if: matrix.variant.mode == 'upstream-fixed'
        shell: pwsh
        run: python -m pip install --no-deps --editable .

      - name: Set up probe
        shell: pwsh
        run: |
          & cmd /d /c "python scripts/pysr_worker_probe.py --mode ${{ matrix.variant.mode }} --phase setup > worker-setup.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content -Path worker-setup.log
          exit $exitCode

      - name: Run probe
        shell: pwsh
        run: |
          & cmd /d /c "python scripts/pysr_worker_probe.py --mode ${{ matrix.variant.mode }} --phase probe > worker-probe.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content -Path worker-probe.log
          exit $exitCode

      - name: Run full PySR worker tests
        if: matrix.variant.mode == 'upstream-fixed'
        shell: pwsh
        run: |
          & cmd /d /c "python -m pysr test main,startup > pysr-tests.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content -Path pysr-tests.log
          exit $exitCode

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pysr-worker-${{ matrix.variant.mode }}-python-${{ matrix.python }}
          path: |
            worker-setup.log
            worker-setup.json
            worker-probe.log
            worker-observations.json
            pysr-tests.log
          if-no-files-found: warn
